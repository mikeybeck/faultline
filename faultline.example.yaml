# Copy to faultline.yaml in your project root, then adjust paths.
#
#   cp faultline.example.yaml faultline.yaml

sources:
  - name: app
    type: generic   # generic | laravel | apache | json | browser | command
    path: logs/app.log

  # Specialized parsers (optional)
  # - name: laravel
  #   type: laravel
  #   path: storage/logs/laravel.log
  # - name: apache
  #   type: apache
  #   path: /var/log/apache2/error.log
  # - name: api
  #   type: json
  #   path: logs/api.log

  # Watch process output instead of a file
  # - name: vite
  #   type: command
  #   path: npm run dev
  #   parser: generic   # generic | json | laravel | apache

# inbox:
#   followLatest: false
#   clearOnCommit: true   # hide current errors when .git/HEAD changes

  # Browser errors via the unpacked extension in extension/
  # (also starts automatically on 127.0.0.1:9477 while watching)
  # - name: browser
  #   type: browser
  #   path: 127.0.0.1:9477

# browser:
#   extraHosts:
#     - localphishingbox.com

notifications:
  enabled: true
  sound: false

editor:
  # One of: code, cursor, phpstorm, or a custom template with {file} and {line}
  # Examples:
  #   command: code
  #   command: cursor
  #   command: phpstorm
  #   command: "nvim +{line} {file}"
  command: code
